name: Test task issues
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/create-task-issues.cjs
      - run: node --test .github/scripts/create-task-issues.test.cjs
