name: On Created
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: on-created-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  on-created:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.is_template == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate task templates
        run: node .github/scripts/create-task-issues.cjs
      - name: Create common task issues and dependencies
        uses: actions/github-script@v7
        with:
          script: |
            const { createTaskIssues } = require('./.github/scripts/create-task-issues.cjs');
            core.info(await createTaskIssues({ github, context }));
      - name: Initialize README
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text()
          text = text.replace('# isucon-boilerplate\n', '# ' + os.environ['GITHUB_REPOSITORY'].split('/')[1] + '\n', 1)
          text = text.replace('$GITHUB_REPOSITORY', os.environ['GITHUB_REPOSITORY'])
          text = text.replace('- [ ] Create a new repository', '- [x] Create a new repository')
          path.write_text(text)
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'リポジトリの README を初期化する'
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
